    function arrow(a,b,color,name){line(a,b,color,2.5);const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.fillStyle=color;path([b,[b[0]-9*Math.cos(ang-.4),b[1]-9*Math.sin(ang-.4)],[b[0]-9*Math.cos(ang+.4),b[1]-9*Math.sin(ang+.4)]]);ctx.fill();ctx.fillStyle=palette.fg;ctx.fillText(name,b[0]+5,b[1]-5);}
    function draw(){
      if(!scene)return;colors();const rect=canvas.getBoundingClientRect();W=rect.width;H=440;const dpr=window.devicePixelRatio||1;canvas.width=Math.round(W*dpr);canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.font=getComputedStyle(root).font;
      const triangles=[];
      for(const o of prepared){const v=o.v.map(project);for(const f of o.f){const pp=f.i.map(i=>v[i]);triangles.push({p:pp,d:pp.reduce((s,p)=>s+p[2],0)/3,n:f.n,name:o.name});}}
      triangles.sort((a,b)=>b.d-a.d);
      for(const t of triangles){path(t.p);ctx.fillStyle=t.name.startsWith('illustrative_adapter')?palette.accent:palette.mesh;ctx.fill();const diffuse=.12+.46*Math.abs(dot(t.n,[.45,-.35,.82]));ctx.globalAlpha=diffuse;ctx.fillStyle=palette.muted;ctx.fill();ctx.globalAlpha=1;}
      if(scene.board){const pp=scene.board.map(project);path(pp);ctx.fillStyle=palette.accent;ctx.globalAlpha=.14;ctx.fill();ctx.globalAlpha=.7;ctx.strokeStyle=palette.accent;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1;}
      const selected=scene.frames[active],p=project(selected.p),length=radius*(choice.value==='tron'?.22:.40);
      for(let i=0;i<3;i++){const end=selected.p.map((v,j)=>v+selected.r[j][i]*length);arrow(p,project(end),palette[['x','y','z'][i]],['X','Y','Z'][i]);}
      // Numbered callouts occupy fixed left-side rows; model points remain exact.
      const show=choice.value==='tron'?scene.frames.filter((f,i)=>i===0||i===2||i===5):scene.frames;
      const fs=parseFloat(getComputedStyle(root).fontSize)||14;ctx.font='400 '+fs+'px '+getComputedStyle(root).fontFamily;
      show.forEach((f,i)=>{const q=project(f.p),label=choice.value==='tron'?f.label:f.label.replace(/^[LR] · /,'');const y=28+i*35,x=12;line([x+18,y+4],q,palette.border,1);ctx.beginPath();ctx.arc(q[0],q[1],f===selected?5:3,0,2*Math.PI);ctx.fillStyle=f===selected?palette.accent:palette.muted;ctx.fill();ctx.fillStyle=palette.fg;ctx.fillText(String(i+1)+'. '+label,x,y);});
      const mm=choice.value==='tron'?100:20,bar=mm/1000*scale();line([W-24-bar,H-24],[W-24,H-24],palette.muted,2);line([W-24-bar,H-28],[W-24-bar,H-20],palette.muted,1);line([W-24,H-28],[W-24,H-20],palette.muted,1);ctx.fillStyle=palette.muted;ctx.fillText(mm+' mm',W-25-bar,H-33);
    }
    function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{view:choice.value,frame:scene.frames[active].name},privateContent:{yaw,pitch,zoom}}).catch(()=>{});}
    choice.addEventListener('change',()=>{load();save();});frameChoice.addEventListener('change',()=>{active=Number(frameChoice.value);detail();draw();save();});
    canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';});
    canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();});
    canvas.addEventListener('pointerup',()=>{drag=null;canvas.style.cursor='grab';save();});canvas.addEventListener('pointercancel',()=>{drag=null;canvas.style.cursor='grab';});
    canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(3,zoom*Math.exp(-e.deltaY*.001)));draw();save();},{passive:false});
    new ResizeObserver(draw).observe(canvas);new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    function restore(state){const model=state?.modelContent,ui=state?.privateContent;if(model&&[...choice.options].some(o=>o.value===model.view)){choice.value=model.view;load();const index=scene.frames.findIndex(f=>f.name===model.frame);if(index>=0){active=index;frameChoice.value=String(index);}}if(ui){if(Number.isFinite(ui.yaw))yaw=ui.yaw;if(Number.isFinite(ui.pitch))pitch=ui.pitch;if(Number.isFinite(ui.zoom))zoom=ui.zoom;}detail();draw();}
    choice.value="right";load();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
  })();
  </script>
